name: Renderizar diagramas PlantUML

on:
  push:
    branches: [main]
    paths:
      - '**/*.puml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml graphviz

      - name: Renderizar todos los .puml a SVG
        run: find . -name '*.puml' -print0 | xargs -0 -n1 plantuml -tsvg

      - name: Commitear SVGs generados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: renderizar diagramas PlantUML [skip ci]"
          file_pattern: '**/*.svg'
